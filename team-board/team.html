@media (max-width:520px){.logo{width:92px}.brand{gap:12px}.brand .sub{padding-left:12px}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;color:var(--muted);font-size:14px}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.pill b{color:var(--ink);font-weight:600}
select.skinpick{appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;padding-right:26px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%235E5E66" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 9px center}
select.skinpick:hover{color:var(--ink);border-color:var(--accent)}
.sound[aria-pressed=true]{color:var(--accent)}
.sound .off{display:none}.sound[aria-pressed=false] .on{display:none}.sound[aria-pressed=false] .off{display:inline}
.notif[aria-pressed=true]{color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:24px;align-items:start}
.col{--c:var(--p0);--c-ink:var(--accent-ink);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:22px 20px 18px;min-width:0}
.k0{--c:var(--p0)}.k1{--c:var(--p1)}.k2{--c:var(--p2)}.k3{--c:var(--p3)}.k4{--c:var(--p4)}.k5{--c:var(--p5)}.k6{--c:var(--p6)}
.col.is-me{box-shadow:0 0 0 2px var(--c)}
.col.is-day{--paper:#F4F4F2;--surface:#FFFFFF;--ink:#141417;--muted:#5E5E66;--line:#E2E2DF;--accent:#EB1843;--accent-ink:#FFFFFF;--strike:#B0102C;--soft:#ECECE9;--p0:#EB1843;--p1:#141417;--p2:#6B4FC8;--p3:#1F6FB5;--p4:#2E7D46;--p5:#C2410C;--p6:#8A6A12;color-scheme:light;background:var(--surface);color:var(--ink)}
.col.is-night{--paper:#0E0E11;--surface:#18181C;--ink:#EDEDF0;--muted:#9A9AA3;--line:#2C2C33;--accent:#FF4D6D;--accent-ink:#17080B;--strike:#FF8A9C;--soft:#232329;--p0:#FF4D6D;--p1:#E6E6EA;--p2:#A48CF0;--p3:#6FB0EE;--p4:#66C987;--p5:#F59E5B;--p6:#D9B44A;color-scheme:dark;background:var(--surface);color:var(--ink)}
.col{transition:background-color .6s,color .6s}
.clock{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:1px 8px 1px 6px;border-radius:999px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock svg{flex:none}
.clock .sun{color:#E8A317}.clock .moon{color:#B9B4F5}
.clock.dubai{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.where-edit{flex-wrap:wrap}
.where-edit select{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 7px;max-width:240px}
.where-edit .tzq{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.presence{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.foldBtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted);font-size:13px;font-weight:600}
.foldBtn:hover{color:var(--ink);border-color:var(--c)}
.foldBtn svg{transition:transform .2s;flex:none}
.col.folded .foldBtn svg{transform:rotate(-90deg)}
.col.folded .colbody{display:none}
.col.folded{padding-bottom:18px}
.myclock{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.presence::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.presence.on{color:var(--ok,#1E8A4C);background:color-mix(in srgb,var(--ok,#1E8A4C) 14%,transparent)}
.presence.on::before{background:var(--ok,#1E8A4C);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok,#1E8A4C) 25%,transparent)}
.presence.off::before{background:var(--muted)}
.photo{width:80px;height:80px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--c)}
.initials{display:grid;place-items:center;background:var(--c);color:var(--c-ink);font-family:var(--display-font);font-weight:700;font-size:30px;letter-spacing:-.02em}
.hero-text{min-width:0}
h2{font-family:var(--display-font);font-weight:700;font-size:clamp(32px,2.6vw,46px);line-height:.95;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.role{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 8px;vertical-align:middle}
.where{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:none;border:0;padding:0;color:var(--muted);font-size:15px}
.where b{color:var(--ink);font-weight:600;border-bottom:1px dashed var(--muted)}
.where:hover b{border-bottom-color:var(--c);color:var(--c)}
.where-edit{display:inline-flex;gap:6px;margin-top:8px;align-items:center}
.where-edit input{font:inherit;color:var(--ink);border:1px solid var(--c);background:var(--surface);border-radius:8px;padding:5px 9px;width:150px}
.tally{margin:14px 0 14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:600}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:7px}
.add input[type=text]{grid-column:1/-1}
.add input,.editor input,.team input,.team select,.addp input,.addp select{font:inherit;color:inherit;min-width:0}
.add input[type=text]{border:0;background:transparent;padding:8px}
.add input[type=text]:focus-visible{outline:none}
.add:focus-within{border-color:var(--c)}
input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;color:var(--ink);color-scheme:light dark}
button{font:inherit;cursor:pointer}
.primary{background:var(--c,var(--accent));color:var(--c-ink,var(--accent-ink));border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--soft);color:var(--ink);font-weight:600}
.tab span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.link:hover{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 2px;border-bottom:1px solid var(--line)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;color:var(--c-ink);transition:background .2s,border-color .2s}
.check:hover{border-color:var(--c)}
.check svg{opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.done .check{background:var(--c);border-color:var(--c)}
.done .check svg{opacity:1;transform:none}
.check.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.body{min-width:0}
.text{font-size:17px;line-height:1.45;overflow-wrap:anywhere;cursor:text;background:linear-gradient(var(--strike),var(--strike)) no-repeat 0 60%/0% 2.5px;transition:background-size .45s ease,color .3s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.done .text{background-size:100% 2.5px;color:var(--muted)}
.due{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar-track{position:relative;flex:1;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;height:100%;background:var(--c,var(--accent));border-radius:999px;transition:width .15s}
.prog input[type=range]{flex:1;max-width:120px;height:16px;accent-color:var(--c,var(--accent));margin:0}
.prog .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:34px;text-align:right;flex:none}
.tasknote{margin:6px 0 0;font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere;white-space:pre-wrap}
.noteedit{margin-top:8px;display:flex;flex-direction:column;gap:6px}

@media (max-width:560px){.fields{grid-template-columns:1fr}.addp{grid-template-columns:1fr}}
.team-tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted)}
.rules{margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}
.send{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.send .wide{grid-column:1/-1}
.send input,.send select{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 10px;min-width:0}
.send .foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:4px}
.sent{color:var(--accent);font-weight:600;margin-right:auto}
.nocols{padding:40px 0;text-align:center;color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.readonly .add,.readonly .actions,.readonly .clear,.readonly #teamBtn,.readonly #sendBtn{display:none}
.readonly .check,.readonly .text,.readonly .where{pointer-events:none}
.readonly .where b{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="todo-state">__STATE__</script>
<script id="app">
(function(){
  var HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>a.k.a. Media team board</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@600;700&family=Space+Grotesk:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">\n';
  var LOCAL_KEY = 'team-todo-local';
  var ME_KEY = 'team-todo-me';
  var AUTH_KEY = 'team-todo-auth';
  var END = '</scr' + 'ipt>';
  var ROLE_NAMES = { superuser: 'Superuser', admin: 'Admin', member: 'Member' };
  var TEAM_NAMES = { management: 'Production', post: 'Post', finance: 'Finance' };

  function store(kind){
    return {
      get:function(k){try{return window[kind].getItem(k);}catch(e){return null;}},
      set:function(k,v){try{window[kind].setItem(k,v);}catch(e){}},
      del:function(k){try{window[kind].removeItem(k);}catch(e){}}
    };
  }
  var ss = store('sessionStorage'), ls = store('localStorage');
  (function(){ var v = ls.get('skin'); if(v === 'sunset' || v === 'ocean' || v === 'neon') document.documentElement.setAttribute('data-skin', v); })();

  function dayOf(ms){ var n = ms ? new Date(ms) : new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset()); return n.toISOString().slice(0,10); }
  function todayStr(){ return dayOf(); }

  // state: { rev, people: [ {id, name, role, location, color, photo, tasks:[]} ] }
  function clean(s){
    if(!s || typeof s !== 'object') s = {};
    if(typeof s.rev !== 'number') s.rev = 0;
    if(!Array.isArray(s.people)) s.people = [];
    if(!s.chat || typeof s.chat !== 'object' || Array.isArray(s.chat)) s.chat = {};
    if(!s.reads || typeof s.reads !== 'object' || Array.isArray(s.reads)) s.reads = {};
    if(!s.acks || typeof s.acks !== 'object' || Array.isArray(s.acks)) s.acks = {};
    if(!s.keys || typeof s.keys !== 'object' || Array.isArray(s.keys)) s.keys = {};
    s.people.forEach(function(p, i){
      if(!p.name) p.name = p.id;
      if(ROLE_NAMES[p.role] === undefined) p.role = 'member';
      if(TEAM_NAMES[p.team] === undefined) p.team = p.role === 'member' ? 'post' : 'management';
      if(!p.location) p.location = 'Dubai';
      if(typeof p.color !== 'number') p.color = i % 7;
      if(!Array.isArray(p.tasks)) p.tasks = [];
      p.tasks.forEach(function(t){ if(!t.due) t.due = dayOf(t.createdAt); });
    });
    return s;
  }
  var embedded;
  try { embedded = JSON.parse(document.getElementById('todo-state').textContent); } catch(e) { embedded = null; }
  var state = clean(embedded);

  var mode = 'loading';           // loading | shared | local | readonly
  var artifactNs = null;
  var saveTimer = null, pendingSave = false, retried = false;
  var ui = {};                    // per person: filter, editing state, elements
  var teamOpen = false, whoOpen = false, sendOpen = false, colSig = '';
  var $ = function(id){ return document.getElementById(id); };

  // ---------- people & permissions ----------
  function person(id){ for(var i=0;i<state.people.length;i++){ if(state.people[i].id === id) return state.people[i]; } return null; }
  function authed(){
    var a; try { a = JSON.parse(ls.get(AUTH_KEY) || 'null'); } catch(e){ a = null; }
    if(!a || !a.pid) return null;
    var k = state.keys && state.keys[a.pid];
    return (k && k.pw === a.pw) ? a.pid : null;
  }
  function me(){ return person(authed()); }
  function myId(){ var m = me(); return m ? m.id : null; }
  function isAdmin(p){ return !!p && (p.role === 'admin' || p.role === 'superuser'); }
  function canSeePw(target){
    var m = me(); if(!isAdmin(m)) return false;
    if(m.role === 'superuser') return true;
    return target.role === 'member';
  }
  function canManageTeam(){ return mode !== 'readonly' && isAdmin(me()); }
  function canChangeRole(target){
    var m = me(); if(!isAdmin(m) || target.role === 'superuser') return false;
    if(target.role === 'admin') return m.role === 'superuser';
    return true;
  }
  function canRemove(target){
    var m = me(); if(!isAdmin(m) || target.role === 'superuser' || target.id === m.id) return false;
    if(target.role === 'admin') return m.role === 'superuser';
    return true;
  }
  // Who sees what (on screen only; see the note in the Team panel):
  // - the superuser sees every list and every task
  // - Management sees every list
  // - everyone sees their own list and their own team's lists
  // - Finance can send tasks to Management without seeing their lists
  // - tasks Finance sends to the superuser are visible only to the superuser
  function canSee(viewer, owner){
    if(!viewer || !owner) return false;
    if(viewer.id === owner.id || viewer.role === 'superuser') return true;
    if(viewer.team === 'management') return true;
    return viewer.team === owner.team;
  }
  function canAddTo(viewer, owner){
    if(canSee(viewer, owner)) return true;
    return !!viewer && !!owner && viewer.team === 'finance' && owner.team === 'management';
  }
  function taskVisible(viewer, owner, t){
    if(!viewer) return false;
    if(viewer.id === owner.id || viewer.role === 'superuser') return true;
    if(owner.role === 'superuser'){
      var from = t.addedBy ? person(t.addedBy) : null;
      if(from && from.team === 'finance') return false;
    }
    return true;
  }
  function visibleTasks(pid){
    var o = person(pid), v = me(); if(!o) return [];
    return o.tasks.filter(function(t){ return taskVisible(v, o, t); });
  }
  function visiblePeople(){
    var v = me(); if(!v) return [];
    var list = state.people.filter(function(p){ return canSee(v, p); });
    list.sort(function(a, b){ return (a.id === v.id ? -1 : 0) - (b.id === v.id ? -1 : 0); });
    return list;
  }
  function addablePeople(){
    var v = me(); if(!v) return [];
    return state.people.filter(function(p){ return canAddTo(v, p); });
  }
  function avatarHtml(p){
    return p.photo
      ? '<img class="photo" alt="" src="' + p.photo + '">'
      : '<div class="photo initials" aria-hidden="true">' + esc((p.name || '?').trim().charAt(0).toUpperCase()) + '</div>';
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---------- skeleton ----------
  $('root').innerHTML =
    '<main class="wrap">' +
      '<div class="topline"><div class="brand"><span class="logo" role="img" aria-label="a.k.a. Media"></span><div class="sub"><b>Team board</b><span>All offices</span></div></div>' +
        '<div class="tools">' +
          '<span class="pill myclock" id="myClock" aria-live="off"></span>' +
          '<button class="pill" id="meBtn" type="button"></button>' +
          '<button class="pill" id="chatBtn" type="button" hidden>Chat<span class="badge" id="chatBadge" hidden></span></button>' +
          '<button class="pill" id="sendBtn" type="button" hidden>Send a task</button>' +
          '<button class="pill" id="teamBtn" type="button" hidden>Manage team</button>' +
          '<select class="pill skinpick" id="skinPick" aria-label="Theme">' +
            '<option value="">Classic</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="neon">Neon</option>' +
          '</select>' +
          '<button class="pill sound" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound effects">' +
            '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor"/><path class="on" d="M10.5 5.5a3.5 3.5 0 010 5M12.5 3.5a6.3 6.3 0 010 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="off" d="M10.5 6l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' +
            '<span class="on">Sound on</span><span class="off">Sound off</span></button>' +
          '<button class="pill notif" id="notifBtn" type="button" hidden aria-pressed="false" aria-label="Notify me on this device">' +
            '<svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.2a4.3 4.3 0 00-4.3 4.3v2.1c0 .6-.2 1.1-.6 1.6L1.2 10h11.6l-.9-.8c-.4-.5-.6-1-.6-1.6V5.5A4.3 4.3 0 007 1.2zm0 11.6a1.5 1.5 0 001.5-1.3h-3A1.5 1.5 0 007 12.8z" fill="currentColor"/></svg>' +
            '<span>Notify me on this device</span></button>' +
        '</div></div>' +
      '<div class="banner" id="roBanner" role="alert" hidden><b>This list is view only for you</b>Your ticks and changes can’t be saved from this browser. Ask Yasser to share the list with you with edit access, then open it again while signed in.</div>' +
      '<div class="cols" id="cols"></div>' +
      '<p class="status" id="status" role="status" aria-live="polite"></p>' +
    '</main>' +
    '<div class="overlay" id="whoOverlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="whoTitle">' +
      '<div class="lg-brand"><span class="logo" role="img" aria-label="a.k.a. Media"></span><span>Team board</span></div>' +
      '<div id="whoBody"></div></div></div>' +
    '<div class="overlay" id="teamOverlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="teamTitle">' +
      '<h3 id="teamTitle">Team</h3><p class="note">Add people, set their team and role, and update names, offices and photos.</p>' +
      '<div class="rules"><b>Who sees what.</b> Production sees every list. Everyone else sees their own list and their team\u2019s lists. Finance can send tasks to Production, and tasks Finance sends to the superuser are only visible to the superuser. <b>This is hidden on screen only</b>, so keep sensitive details out of task text until the team moves to one Claude Team plan.</div>' +
      '<div class="team" id="teamList"></div>' +
      '<form class="addp" id="addPerson"><h4>Add a person</h4>' +
        '<input type="text" id="apName" placeholder="Name" aria-label="Name" required autocomplete="off">' +
        '<input type="text" id="apLoc" placeholder="Office, e.g. Riyadh" aria-label="Office" autocomplete="off">' +
        '<select id="apTeam" aria-label="Team"><option value="post">Post</option><option value="finance">Finance</option><option value="management">Production</option></select>' +
        '<select id="apRole" aria-label="Role"><option value="member">Member</option><option value="admin">Admin</option></select>' +
        '<button class="primary" type="submit">Add person</button></form>' +
      '<div class="foot"><button class="primary" id="teamDone" type="button">Done</button></div>' +
    '</div></div>' +
    '<div class="overlay" id="sendOverlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sendTitle">' +
      '<h3 id="sendTitle">Send a task</h3><p class="note">It goes straight onto their list, marked as from you.</p>' +
      '<form class="send" id="sendForm">' +
        '<label>To<select id="sendTo" required></select></label>' +
        '<label>To do date<input type="date" id="sendDue" required></label>' +
        '<label class="wide">Task<input type="text" id="sendText" required autocomplete="off" placeholder="What needs doing?"></label>' +
        '<label class="wide">File link (optional)<input type="text" inputmode="url" id="sendLink" autocomplete="off" placeholder="Paste a Google Drive link"></label>' +
        '<div class="foot"><span class="sent" id="sentNote" role="status" aria-live="polite"></span><button class="link" type="button" id="sendCancel">Close</button><button class="primary" type="submit">Send task</button></div>' +
      '</form></div></div>' +
    '<div class="toasts" id="toasts" aria-live="polite"></div>' +
    '<aside class="chat k0" id="chatPanel" hidden aria-labelledby="chatTitle">' +
      '<div class="chat-head"><div class="top"><h3 id="chatTitle">Team chat</h3><span class="chat-acts"><a class="callbtn alertbtn" id="alertBtn" role="button" href="#" title="Get someone\u2019s attention" aria-label="Send an attention alert"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0112 0v5.5l1.5 2H4.5zM10 20.5a2 2 0 004 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M3 7.5c.6-1.7 1.6-3.1 3-4M21 7.5c-.6-1.7-1.6-3.1-3-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></a><a class="callbtn" id="voiceCall" target="_blank" rel="noopener noreferrer" href="#" title="Start a voice call" aria-label="Start a voice call"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5l2.6 3.4-1.6 2.3a13 13 0 006.2 6.2l2.3-1.6 3.4 2.6-1.3 3A2 2 0 0116.3 20 16.3 16.3 0 014 7.7a2 2 0 011.6-2.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></a><a class="callbtn" id="videoCall" target="_blank" rel="noopener noreferrer" href="#" title="Start a video call" aria-label="Start a video call"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="12.5" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 10.5l5-3v9l-5-3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></a><a class="tfiles" id="teamFiles" target="_blank" rel="noopener noreferrer" href="https://drive.google.com/drive/folders/1ZeCn53_VgPlSZ0ybts4QlBoIxexRxjFh" title="AKATEAMFILEEXCHANGE on Google Drive">Team files \u2197</a><button class="link" type="button" id="chatClose">Close</button></span></div>' +
        '<div class="chans" id="chans" role="tablist" aria-label="Channels"></div>' +
        '<p class="chat-note" id="chatNote"></p><div class="callpick" id="callPick" hidden></div></div>' +
      '<div class="msgs" id="msgs" aria-live="polite"></div>' +
      '<form class="composer" id="composer"><div class="pending" id="pendingFiles" hidden></div><div class="cattach" id="cAttach" hidden></div><button class="clip" type="button" id="clipBtn" aria-label="Share a file" aria-expanded="false" title="Share a file from Google Drive"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5.3 5.3 0 01-7.5-7.5l8.6-8.6a3.5 3.5 0 015 5l-8.6 8.6a1.8 1.8 0 01-2.5-2.5l7.9-7.9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="clip urgent" type="button" id="urgentBtn" aria-pressed="false" aria-label="Mark this message urgent, so it rings an alarm for the other person" title="Mark urgent: rings an alarm for the other person until they answer">🔔</button><textarea id="chatText" rows="1" placeholder="Write a message" aria-label="Message"></textarea><button class="primary" type="submit">Send</button></form>' +
    '</aside>';

  // ---------- helpers ----------
  function uid(prefix){ return (prefix || 't') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmtDue(s){
    try { return new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); }
    catch(e){ return s; }
  }
  function tasksOf(pid){ var p = person(pid); return p ? p.tasks : []; }
  function find(pid, id){ var t = tasksOf(pid); for(var i=0;i<t.length;i++){ if(t[i].id === id) return t[i]; } return null; }
  function sorted(pid){
    var all = visibleTasks(pid);
    var open = all.filter(function(t){ return !t.done; });
    var done = all.filter(function(t){ return t.done; });
    var manual = person(pid) && person(pid).manual;
    open.sort(function(a,b){
      if(manual){
        var ao = typeof a.order === 'number' ? a.order : 1e15 + (a.createdAt || 0);
        var bo = typeof b.order === 'number' ? b.order : 1e15 + (b.createdAt || 0);
        if(ao !== bo) return ao - bo;
      }
      if(a.due !== b.due) return a.due < b.due ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
    done.sort(function(a,b){ return (b.doneAt || 0) - (a.doneAt || 0); });
    return open.concat(done);
  }
  function setStatus(msg){ $('status').textContent = msg || ''; }
  function anyEditing(){
    if(teamOpen || whoOpen || sendOpen) return true;
    return state.people.some(function(p){ var u = ui[p.id]; return u && (u.editingId || u.editingWhere || u.attachId); });
  }

  // ---------- columns ----------
  function signature(){ return visiblePeople().map(function(p){ return [p.id, p.name, p.role, p.team, p.color, (p.photo || '').length].join('|'); }).join('/') + '#' + (myId() || ''); }

  // fold a person's list down to just their name/photo until you click to open it; your own list starts open
  function foldKey(pid){ return 'col-fold-' + pid; }
  function isFolded(pid, mine){
    var v = ls.get(foldKey(pid));
    if(v === '1') return true;
    if(v === '0') return false;
    return pid !== mine;
  }
  function setFolded(sec, folded, pid){
    sec.classList.toggle('folded', folded);
    var btn = sec.querySelector('.foldBtn'); if(!btn) return;
    btn.setAttribute('aria-expanded', folded ? 'false' : 'true');
    btn.querySelector('span').textContent = folded ? 'Show' : 'Hide';
    if(pid) ls.set(foldKey(pid), folded ? '1' : '0');
  }

  function buildColumns(){
    var sig = signature(); if(sig === colSig){ paintPresence(); return; } colSig = sig;
    var cols = $('cols'); cols.textContent = '';
    var mine = myId();
    var shown = visiblePeople();
    if(!shown.length && me()){ cols.innerHTML = '<p class="nocols">No lists to show.</p>'; }
    shown.forEach(function(p){
      var sec = document.createElement('section');
      sec.className = 'col k' + (p.color % 7) + (p.id === mine ? ' is-me' : '');
      sec.id = 'col-' + p.id; sec.setAttribute('aria-label', p.name + '’s list');
      sec.innerHTML =
        '<div class="hero">' + avatarHtml(p) +
          '<div class="hero-text"><h2></h2><div class="whereBox"></div><span class="team-tag"></span></div>' +
          '<span class="presence off" aria-label="' + p.name + '’s status">Asleep</span>' +
          '<button class="foldBtn" type="button" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Hide</span></button>' +
        '</div>' +
        '<div class="colbody">' +
        '<p class="tally"></p>' +
        '<div class="add">' +
          '<input type="text" class="newText" autocomplete="off">' +
          '<input type="date" class="newDue" required aria-label="To do date" title="To do date">' +
          '<button class="primary addBtn" type="button">Add task</button>' +
        '</div>' +
        '<div class="bar">' +
          '<div class="tabs" role="tablist">' +
            '<button class="tab" role="tab" data-filter="all">All<span class="cAll"></span></button>' +
            '<button class="tab" role="tab" data-filter="open">To do<span class="cOpen"></span></button>' +
            '<button class="tab" role="tab" data-filter="done">Done<span class="cDone"></span></button>' +
          '</div>' +
          '<span><button class="link bydate" type="button" hidden title="Go back to ordering by to do date">Sort by date</button> ' +
          '<button class="link clear" type="button">Clear done tasks</button></span>' +
        '</div>' +
        '<ul class="list"></ul>' +
        '</div>';
      var h2 = sec.querySelector('h2'); h2.textContent = p.name + '’s list';
      if(p.role !== 'member'){ var r = document.createElement('span'); r.className = 'role'; r.textContent = ROLE_NAMES[p.role]; h2.appendChild(r); }
      sec.querySelector('.tabs').setAttribute('aria-label', 'Show ' + p.name + '\u2019s tasks');
      sec.querySelector('.team-tag').textContent = TEAM_NAMES[p.team] + ' team';
      var nt = sec.querySelector('.newText');
      nt.placeholder = 'Add a task for ' + p.name; nt.setAttribute('aria-label', 'New task for ' + p.name);
      cols.appendChild(sec);
      wireColumn(p.id, sec);
      setFolded(sec, isFolded(p.id, mine));
      sec.querySelector('.foldBtn').addEventListener('click', function(){
        setFolded(sec, !sec.classList.contains('folded'), p.id);
      });
    });
    Object.keys(ui).forEach(function(id){ if(!person(id)) delete ui[id]; });
    paintPresence();
  }

  function wireColumn(pid, col){
    var old = ui[pid] || {};
    var u = ui[pid] = {
      filter: old.filter || ss.get('todo-filter-' + pid) || 'all',
      editingId: null, armedDelete: null, armTimer: null, editingWhere: false, noteId: null, remindId: null,
      col: col, list: col.querySelector('.list'),
      newText: col.querySelector('.newText'), newDue: col.querySelector('.newDue')
    };
    try {
      var d = JSON.parse(ss.get('todo-draft-' + pid) || 'null');
      if(d){ u.newText.value = d.text || ''; u.newDue.value = d.due || ''; }
    } catch(e){}
    if(!u.newDue.value) u.newDue.value = todayStr();
    if(ss.get('todo-refocus') === pid){ ss.del('todo-refocus'); setTimeout(function(){ u.newText.focus(); }, 30); }

        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * 0.45,

  function applyOp(st, o){

    if(o.type === 'ack'){

    var list = p.tasks;
    if(o.type === 'fadd'){
      list.forEach(function(t){ if(t.id === o.id){ t.files = t.files || []; if(!t.files.some(function(f){ return f.id === o.file.id; })) t.files.push(JSON.parse(JSON.stringify(o.file))); } });
      return;
    }
    if(o.type === 'fdel'){
      list.forEach(function(t){ if(t.id === o.id && t.files) t.files = t.files.filter(function(f){ return f.id !== o.fid; }); });
      return;
    }
    if(o.type === 'reorder'){
      p.manual = true;
      list.forEach(function(t){ if(o.orders[t.id] !== undefined) t.order = o.orders[t.id]; });
      return;
    }
    if(o.type === 'bydate'){ p.manual = false; list.forEach(function(t){ delete t.order; }); return; }
    if(o.type === 'add'){
      if(!list.some(function(t){ return t.id === o.task.id; })){
        var nt = JSON.parse(JSON.stringify(o.task));
        if(p.manual && typeof nt.order !== 'number'){
          var mx = 0; list.forEach(function(t){ if(typeof t.order === 'number' && t.order > mx) mx = t.order; });
          nt.order = mx + 1;
        }
        list.push(nt);
      }
    } else if(o.type === 'set'){
      list.forEach(function(t){ if(t.id === o.id){ for(var k in o.fields) t[k] = o.fields[k]; } });
    } else if(o.type === 'del'){
      p.tasks = list.filter(function(t){ return t.id !== o.id; });
    } else if(o.type === 'clear'){
      p.tasks = list.filter(function(t){ return o.ids.indexOf(t.id) === -1; });
    }
  }
  function content(st){ return JSON.stringify({ p: st.people, c: st.chat || {}, r: st.reads || {}, a: st.acks || {}, k: st.keys || {} }); }
  function change(o){
    if(mode === 'readonly') return;
    applyOp(state, o);
    var q = loadOps(); q.push(o); storeOps(q);
    scheduleSave();
  }
  // replay anything this tab changed that the loaded version doesn't have yet
  (function reconcile(){
    var q = loadOps(); if(!q.length) return;
    var before = content(state);
    q.forEach(function(o){ applyOp(state, o); });
    if(content(state) === before) storeOps([]);
    else pendingSave = true;
  })();

  // ---------- saving ----------
  function scheduleSave(){
    pendingSave = true;
    clearTimeout(saveTimer);
    if(mode === 'shared') setStatus('Unsaved changes…');
    saveTimer = setTimeout(save, 1200);
  }

  function buildHtml(){
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app').textContent;
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="en">\n<head>\n' + HEAD +
      '<style id="app-style">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
      '<script type="application/json" id="todo-state">' + json + END + '\n' +
      '<script id="app">' + js + END + '\n</body>\n</html>\n';
  }

  function save(){
    saveTimer = null;
    if(!pendingSave) return;
    if(mode === 'loading') return;              // saved once the runtime answers
    if(anyEditing()){ saveTimer = setTimeout(save, 1500); return; }  // wait until editing is finished
    if(mode === 'readonly'){ pendingSave = false; return; }
    if(mode === 'local'){
      ls.set(LOCAL_KEY, JSON.stringify(state)); pendingSave = false;
      setStatus('Saved in this browser only.'); return;
    }
    pendingSave = false;
    state.rev += 1; state.updatedAt = new Date().toISOString();
    setStatus('Saving…');
    state.people.forEach(function(p){
      var u = ui[p.id]; if(!u) return;
      u.stash();
      if(document.activeElement === u.newText) ss.set('todo-refocus', p.id);
    });
    artifactNs.publish(buildHtml()).then(function(){
      retried = false; setStatus('Saved');
    }, function(err){
      var code = err && err.code;
      state.rev -= 1;
      if(code === 'conflict'){
        setStatus('Someone else saved first. Loading the latest version.');
      } else if(['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].indexOf(code) !== -1){
        mode = 'readonly'; state = clean(JSON.parse(document.getElementById('todo-state').textContent)); storeOps([]);
        state.people.forEach(function(p){ if(ui[p.id]){ ui[p.id].editingId = null; ui[p.id].editingWhere = false; } });
        if(teamOpen){ teamOpen = false; $('teamOverlay').hidden = true; }
        if(sendOpen){ sendOpen = false; $('sendOverlay').hidden = true; }
        colSig = ''; render(); setStatus(''); $('roBanner').hidden = false;
      } else if(code === 'rate_limited'){
        pendingSave = true; setStatus('Saving shortly…'); saveTimer = setTimeout(save, 8000);
      } else if(!retried){
        retried = true; pendingSave = true; saveTimer = setTimeout(save, 1000 + Math.random() * 1500);
      } else {
        retried = false; pendingSave = true;
        setStatus('Couldn’t save. Your changes are still here and will be saved with your next edit.');
      }
    });
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden' && pendingSave && mode === 'shared' && !anyEditing()){ clearTimeout(saveTimer); save(); }
  });

  // ---------- once a minute: save anything pending, then reload to pick up the latest board ----------
  var loadedAt = Date.now(), lastTouch = 0;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function(ev){ document.addEventListener(ev, function(){ lastTouch = Date.now(); }, { passive: true, capture: true }); });
  function busyNow(){
    if(anyEditing()) return true;
    if(Date.now() - lastTouch < 20000) return true;
    var ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
    var ta = $('chatText'); if(ta && ta.value.trim()) return true;
    if(typeof pendingFiles !== 'undefined' && pendingFiles.length) return true;
    if($('cAttach') && !$('cAttach').hidden) return true;
    if($('callPick') && !$('callPick').hidden) return true;
    if($('alarmBox')) return true;
    if(dragging) return true;
    if(teamOpen || sendOpen || (!$('whoOverlay').hidden)) return true;
    return false;
  }
  setInterval(function(){
    if(mode !== 'shared') return;
    if(pendingSave){ if(!anyEditing()){ clearTimeout(saveTimer); save(); } return; }   // saving reloads every open board anyway
    if(Date.now() - loadedAt < 55000 || busyNow()) return;
    try { ss.set('todo-scroll', String(window.scrollY || 0)); var ml = $('msgs'); if(ml) ss.set('chat-scroll', String(ml.scrollTop)); } catch(e){}
    location.reload();
  }, 60000);
  (function restoreScroll(){
    var y = +(ss.get('todo-scroll') || 0), cy = ss.get('chat-scroll');
    ss.del('todo-scroll'); ss.del('chat-scroll');
    if(y) setTimeout(function(){ window.scrollTo(0, y); }, 60);
    if(cy !== null && cy !== undefined && cy !== '') setTimeout(function(){ var ml = $('msgs'); if(ml) ml.scrollTop = +cy; }, 120);
  })();

  render();
  if(!me()) openWho();
  else if(chatOpen){ $('chatPanel').hidden = false; document.body.classList.add('chat-on'); renderChat(true); renderTop(); }
  setTimeout(function(){ announceNew(); announceNewTasks(); announceReads(); checkStoredAlerts(); checkStoredReminders(); }, 400);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && chatOpen) recordRead(chatChan); });

  (function connect(){
    var p = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('artifact') : Promise.resolve(null);
    Promise.resolve(p).catch(function(){ return null; }).then(function(ns){
      if(ns){ artifactNs = ns; mode = 'shared'; }
      else {
        mode = 'local';
        try {
          var loc = JSON.parse(ls.get(LOCAL_KEY) || 'null');
          if(loc && Array.isArray(loc.people) && !pendingSave){ state = clean(loc); colSig = ''; }
        } catch(e){}
      }
      render();
      if(pendingSave) scheduleSave();
    });
  })();
})();
</script>
</body>
</html>
